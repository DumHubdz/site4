<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Key Bypasser 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 620px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255,0,255,0.3);
        }
        h1 {
            color: #ff00ff;
            margin-bottom: 10px;
            font-size: 32px;
        }
        p {
            color: #ccc;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            background: #1a1a2e;
            color: white;
            margin-bottom: 20px;
            outline: none;
        }
        button {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 8px;
        }
        .bypass-btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: black;
        }
        .bypass-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px #ff00ff;
        }
        .copy-btn {
            background: #00ff88;
            color: black;
            display: none;
        }
        .result {
            margin-top: 25px;
            padding: 18px;
            background: #1a1a2e;
            border-radius: 12px;
            min-height: 80px;
            font-size: 18px;
            word-break: break-all;
            border: 1px solid #333;
        }
        .status { color: #00ff88; font-weight: bold; }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delta Key Bypasser 2026</h1>
        <p>Dán link key từ Delta Executor vào đây</p>
        
        <input type="text" id="linkInput" placeholder="https://loot-link.com/s?... hoặc gateway.platoboost..."/>
        
        <button class="bypass-btn" onclick="startBypass()">Bypass Key Ngay</button>
        
        <div class="result" id="result">
            Kết quả key sẽ xuất hiện ở đây sau khi bypass...
        </div>
        
        <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 Copy Key</button>

        <footer>
            Trang bypass tốt nhất: <a href="https://keybypass.net" target="_blank" style="color:#00ffff;">keybypass.net</a><br>
            Hoặc thử <a href="https://bypass.city" target="_blank" style="color:#00ffff;">bypass.city</a>
        </footer>
    </div>

    <script>
        let currentKey = "";

        function startBypass() {
            const link = document.getElementById("linkInput").value.trim();
            const resultDiv = document.getElementById("result");
            const copyBtn = document.getElementById("copyBtn");

            if (!link) {
                resultDiv.innerHTML = "Vui lòng dán link key từ Delta vào!";
                return;
            }

            resultDiv.innerHTML = "Đang bypass...";
            copyBtn.style.display = "none";

            // Mở trang bypass tốt nhất hiện tại (keybypass.net)
            const bypassUrl = `https://keybypass.net/?url=${encodeURIComponent(link)}`;
            window.open(bypassUrl, "_blank");

            resultDiv.innerHTML = `
                 Đã mở <strong>keybypass.net</strong>!<br><br>
                <span class="status">1. Dán link vào ô trên keybypass.net<br>
                2. Nhấn Bypass<br>
                3. Copy key → Dán lại vào Delta</span>
            `;
        }

        function copyKey() {
            if (currentKey) {
                navigator.clipboard.writeText(currentKey).then(() => {
                    alert(" Đã copy key thành công!");
                });
            }
        }

        // Nhấn Enter cũng bypass được
        document.getElementById("linkInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") startBypass();
        });
    </script>
</body>
  </html>
